services:
  uowatch:
    image: python:3.13-alpine
    container_name: uowatch
    command: ["python3", "/app/watch.py"]
    env_file: .env
    volumes:
      - ./watch.py:/app/watch.py:ro
      - uowatch-state:/state
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "[ $$(( $$(date +%s) - $$(stat -c %Y /tmp/HEARTBEAT) )) -lt 100000 ]"]
      interval: 300s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

volumes:
  uowatch-state:
