name: Deployment Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Daily rebuild: security patches should not wait for a weekly slot.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: deployment-verification-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Authenticated requests avoid the anonymous API rate limit that shared
  # GitHub runners regularly hit (api.github.com answers 403 otherwise).
  GH_API_TOKEN: ${{ github.token }}

jobs:
  lint:
    name: Lint shell scripts, Dockerfile, python, and workflow YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            koalaman/shellcheck-alpine:stable \
            shellcheck tools/set-password.sh tools/world-stats.sh tools/init-save-layout.sh tools/healthcheck.sh tests/e2e-save-layout.sh tests/e2e-census.sh tests/secret-probe.sh tests/e2e-start.sh tools/start.sh tests/fixtures/fake-dotnet update.sh

      - name: hadolint (Dockerfile linting)
        run: |
          docker run --rm -i -v "$PWD/.hadolint.yaml:/.hadolint.yaml:ro" hadolint/hadolint < Dockerfile

      - name: Compile-check the python tools
        run: |
          python3 -m py_compile tools/sethash.py uowatch/watch.py

      - name: actionlint (GitHub Actions workflow linting)
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            rhysd/actionlint:1.7.12 \
            -color

  healthcheck:
    name: The health check can go red, and green
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 tests/e2e-healthcheck.sh

      - name: Four assertions against the runtime base image
        # ModernUO is .NET, so the only comm in the container is dotnet and a
        # /proc/*/comm check can never match. The pattern therefore reads the
        # command line - where, unbracketed, it matches the shell carrying the
        # check and is green on a container with nothing running at all. Both
        # halves are measured here rather than asserted in a comment.
        run: |
          chmod +x tests/e2e-healthcheck.sh
          ./tests/e2e-healthcheck.sh

  save-layout:
    name: The save directory is not the mount point
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The mechanism, the init step, the health check and the index reader
        # A full shard cannot boot here, so the save cycle itself is not
        # observed. Every piece the fix rests on is: that a mount point cannot
        # be renamed and a directory inside one can; that the init step moves an
        # old-layout world, rewrites world.savePath, refuses two worlds and is
        # idempotent; that the health check, the same file production runs,
        # goes red on a stale save and on no process; and that the save-index
        # reader counts a v5 index correctly and refuses a version it does not
        # know. Negative cases throughout: a check that has only ever passed
        # has not proved it can fail.
        run: |
          chmod +x tests/e2e-save-layout.sh
          ./tests/e2e-save-layout.sh

      - name: A save counted by type, two saves compared, and what is refused
        # Indexes written in the layout ModernUO writes, a migration modelled
        # between two of them, and each index the census must refuse.
        run: ./tests/e2e-census.sh

  scan-trivy:
    name: Scan the image this repository builds
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        # The scan has to see what this repository actually ships. There is no
        # upstream image to pin a digest to - the shard is compiled here - so
        # scanning anything else would be scanning somebody else's work.
        run: |
          ref="$(grep -m1 -oE '\$\{MODERNUO_REF:-[^}]*' docker-compose.yml | sed 's/.*:-//')"
          echo "building ModernUO $ref"
          docker build --build-arg "MODERNUO_REF=$ref" -t "modernuo:$ref" .
          echo "IMAGE=modernuo:$ref" >> "$GITHUB_ENV"

      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy-modernuo.sarif
          ignore-unfixed: true
          # FINDINGS DO NOT FAIL THIS STEP; A SCAN THAT CANNOT FINISH DOES.
          # Stated here rather than left to the action's default, because
          # this job no longer carries continue-on-error and the difference
          # now decides whether a red run means a new CVE upstream or a
          # scanner that died before it could report one.
          exit-code: "0"
          severity: CRITICAL,HIGH

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-modernuo.sarif
          category: trivy-modernuo

  scan-init:
    name: Scan the pinned init image with Trivy
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the pinned init image from the compose file
        id: pin
        run: |
          image="$(grep -m1 -oE '\$\{MODERNUO_INIT_IMAGE_TAG:-.*' docker-compose.yml | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
          [ -n "$image" ] || { echo "MODERNUO_INIT_IMAGE_TAG default not found in x-images" >&2; exit 1; }
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Trivy scan of the init image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.pin.outputs.image }}
          format: sarif
          output: trivy-init.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-init.sarif
          category: trivy-init

  build-and-test:
    name: Build the image + runtime smoke
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate test .env
        run: cp .env.example .env

      - name: Build the ModernUO image from the pinned release
        run: docker compose build

      - name: A stop says "save" on the console first - the signal path, with a stand-in shard
        # No shard runs here without the UO client files. tests/e2e-start.sh
        # runs tools/start.sh in the image just built with a stand-in for
        # the server: it gets a terminal (ModernUO reads its console only
        # from one), and on docker stop "save" reaches it, the world is
        # written, and only then does the server get SIGTERM. The image's
        # own entrypoint, the control: headless, and no save.
        run: ./tests/e2e-start.sh

      - name: Boot the server binary and verify the runtime dependencies
        env:
          # No world to save without a shard: the stop need not wait long.
          MODERNUO_STOP_SAVE_WAIT: "3"
        # The UO client art/map files are proprietary and deliberately not
        # in this repository, so a full shard cannot boot in CI. What CAN
        # be proven: the published binary starts under the runtime image
        # and gets past Core.Setup — exactly the stage that dies with
        # "Could not load libdeflate" when the native-library fix is
        # missing — and stops only at the missing client data.
        run: |
          mkdir -p data config uodata
          docker compose up -d
          sleep 30
          docker compose logs > boot.log 2>&1
          cat boot.log | tail -20
          if grep -qiE "could not load|DllNotFoundException" boot.log; then
            echo "::error::Native runtime dependency failed to load"
            exit 1
          fi
          if ! grep -qiE "ModernUO|Core:" boot.log; then
            echo "::error::The server binary produced no recognizable startup output"
            exit 1
          fi
          echo "Server binary starts and reaches the client-data stage"
          # The real server under tools/start.sh: it has a terminal now, so it
          # waits at its first-run question instead of failing on it, and a
          # stop goes through start.sh ("save" first, then SIGTERM).
          docker compose logs modernuo 2>&1 | grep -q 'HeadlessConsoleInputException' && { echo "::error::the server is still headless under start.sh"; exit 1; }
          docker compose stop modernuo >/dev/null
          docker compose logs modernuo 2>&1 | grep -E 'start.sh: (stopping|no save|the world is saved)' || { echo "::error::the stop did not go through start.sh"; exit 1; }

      - name: The webhook address uowatch posts to, looked for everywhere (tests/secret-probe.sh)
        # The one secret this template handles: an incoming webhook's address
        # is its key. The compose files pass no secret-named variable, so the
        # probe plants nothing; the address is set where an operator sets it,
        # in uowatch/.env, a random one (an address that answers nothing), and
        # added to the probe's values. Then uowatch runs its first poll, and
        # the probe looks for it in docker compose logs, every command line in
        # the container and the host's ps; again after a restart.
        env:
          PROBE_PROJECT: uowatch
          PROBE_COMPOSE: uowatch/docker-compose.yml
        run: |
          tests/secret-probe.sh plant
          url="http://192.0.2.1:9/hooks/k$(openssl rand -hex 12)"
          echo "::add-mask::$url"
          ( umask 077
            printf 'WEBHOOK_URL=%s\nPINNED_VERSION=ci\n' "$url" > uowatch/.env
            printf 'WEBHOOK_URL\t%s\n' "$url" >> "$RUNNER_TEMP/secret-probe.values" )
          W="docker compose -p uowatch -f uowatch/docker-compose.yml"
          $W up -d >/dev/null
          for _ in $(seq 1 60); do $W logs --no-color 2>/dev/null | grep -qE 'check failed|post failed' && break; sleep 1; done
          $W logs --no-color | tail -5
          tests/secret-probe.sh check "uowatch, after its first poll"
          $W restart >/dev/null
          for _ in $(seq 1 60); do [ "$($W logs --no-color 2>/dev/null | grep -c 'uowatch up')" -ge 2 ] && break; sleep 1; done
          sleep 20
          tests/secret-probe.sh check "uowatch, after a restart"
          tests/secret-probe.sh selftest

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Shutdown Docker Compose services
        if: always()
        run: |
          docker compose down
          docker compose -p uowatch -f uowatch/docker-compose.yml down -v >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/secret-probe.values" uowatch/.env
