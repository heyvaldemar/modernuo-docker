name: Pin Freshness

# ITS OWN WORKFLOW, SO THE BADGE MEANS WHAT A READER THINKS IT MEANS.
#
# This job used to run inside Deployment Verification, whose badge is the one
# on the README and in the catalogue. It is a designed alarm: it goes red when
# a pin falls behind upstream, and the fleet's triage moves the pin within the
# day. Measured across the fleet over fourteen days, nine red runs in ten were
# this alarm and nothing else, and a visitor cannot tell "one version behind"
# from "does not boot". The job below is unchanged; only its address moved.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Daily rebuild: security patches should not wait for a weekly slot.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: pin-freshness-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Authenticated requests avoid the anonymous API rate limit that shared
  # GitHub runners regularly hit (api.github.com answers 403 otherwise).
  GH_API_TOKEN: ${{ github.token }}

jobs:
  check-source-freshness:
    name: Check the pinned ModernUO release for upstream drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Weekly cron + manual dispatch only — the pinned MODERNUO_REF in
    # .env.example is the tested release; this job is the bump signal
    # (uowatch does the same job for a running deployment).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare MODERNUO_REF against the latest upstream release
        run: |
          pinned="$(grep -oE '^MODERNUO_REF=.+' .env.example | cut -d= -f2)"
          latest="$(curl -fsSL --retry 3 -H "Authorization: Bearer $GH_API_TOKEN" https://api.github.com/repos/modernuo/ModernUO/releases/latest | jq -r .tag_name)"
          latest="${latest#v}"
          if [ -z "$latest" ] || [ "$latest" = "null" ]; then
            echo "::error::Could not determine the latest ModernUO release"
            exit 1
          fi
          # ORDER, NOT INEQUALITY. `!=` calls any difference "behind", including
          # being ahead, and GitHub's releases/latest is the most recently
          # PUBLISHED release rather than the highest version. sort -V, because
          # a string compare puts 0.15.6.178 below 0.15.6.99.
          if [ "$pinned" = "$latest" ]; then
            echo "MODERNUO_REF ${pinned} matches the latest release"
          elif [ "$(printf '%s\n%s\n' "$pinned" "$latest" | sort -V | head -1)" = "$pinned" ]; then
            echo "::error::MODERNUO_REF is behind: pinned ${pinned}, latest release is ${latest}"
            exit 1
          else
            echo "MODERNUO_REF ${pinned} is ahead of the published ${latest}, which is what a maintenance release for an older branch looks like"
          fi

      - name: Compare the init image pin against what its tag resolves to now
        # The compose file pins alpine by digest for the init service. A tag
        # that re-resolves to a new digest is a rebuild upstream, and a pin that
        # nobody re-resolves is a pin nobody is watching.
        run: |
          pin="$(grep -m1 -oE '\$\{MODERNUO_INIT_IMAGE_TAG:-.*' docker-compose.yml | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
          ref="${pin%%@*}"; pinned_digest="${pin##*@}"
          current_digest=""
          for attempt in 1 2 3; do
            current_digest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty')"
            [ -n "$current_digest" ] && break
            sleep $(( attempt * 5 ))
          done
          if [ -z "$current_digest" ]; then
            echo "::error::${ref} did not resolve after three attempts: the registry did not answer, or the tag is gone. The pin itself is unchanged."
            exit 1
          fi
          if [ "$pinned_digest" != "$current_digest" ]; then
            echo "::error::MODERNUO_INIT_IMAGE_TAG digest drift: pinned ${pinned_digest}, but ${ref} now resolves to ${current_digest}"
            exit 1
          fi
          echo "MODERNUO_INIT_IMAGE_TAG OK (${ref})"
